version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: edupredict-db
    environment:
      POSTGRES_USER: edupredict_user
      POSTGRES_PASSWORD: edupredict_secure_password
      POSTGRES_DB: edupredict_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupredict_user -d edupredict_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: edupredict-backend
    environment:
      DATABASE_URL: postgresql://edupredict_user:edupredict_secure_password@db:5432/edupredict_db
      SECRET_KEY: ${SECRET_KEY:-edupredict-super-secret-production-key-2026}
    volumes:
      - backend_artifacts:/app/artifacts
      - ./data/sample:/app/data/sample
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: edupredict-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_artifacts:
